models:
  - name: dim_listings_cleansed
    # data_tests:
    #   - minimum_row_counts:
    #       arguments:
    #         row_count: 20

    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
        severity: warn

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "Entire home/apt"
                  - "Private room"
                  - "Shared room"
                  - "Hotel room"

      - name: minimum_nights
        data_tests:
          - positive_values

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb','listings')

  - name: dim_hosts_cleansed
    contract:
      enforced: true

    columns:
      - name: host_id
        data_type: integer
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ["t", "f"]

      - name: updated_at
        data_type: timestamp

      - name: created_at
        data_type: timestamp
